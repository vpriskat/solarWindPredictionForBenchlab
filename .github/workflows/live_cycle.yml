name: Live Solar Wind Cycle

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      t0:
        description: "Optional cycle timestamp (e.g. 20261126T120000Z); defaults to current UTC cycle"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: live-cycle
  cancel-in-progress: false

jobs:
  run-live-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run live forecast cycle in container
        run: |
          IMAGE="${{ steps.meta.outputs.image }}:${{ github.sha }}"
          docker pull "${IMAGE}"
          if [ -n "${{ inputs.t0 }}" ]; then
            docker run --rm \
              -e SWP_STORAGE_URL="" \
              "${IMAGE}" "${{ inputs.t0 }}"
          else
            docker run --rm \
              -e SWP_STORAGE_URL="" \
              "${IMAGE}"
          fi