name: Live Solar Wind Cycle

on:
  schedule:
    - cron: "20 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      t0:
        description: "Optional cycle timestamp (e.g. 20261126T120000Z); empty = latest 6h cycle"
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: live-cycle
  cancel-in-progress: false

jobs:
  run-live-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SWP_STORAGE_URL: ""            # replaced by the R2 secret once storage is connected
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pipeline image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker pull "${IMAGE}"

      - name: Run forecast cycle
        env:
          T0: ${{ inputs.t0 }}
        run: |
          docker run --rm \
            -e SWP_STORAGE_URL \
            -e SWP_RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "${IMAGE}" cycle ${T0:+"$T0"}

      - name: Update truth series
        if: always()
        run: |
            docker run --rm -e SWP_STORAGE_URL "${IMAGE}" truth

      - name: Publish web files
        if: always()
        run: |
          docker run --rm -e SWP_STORAGE_URL "${IMAGE}" publish