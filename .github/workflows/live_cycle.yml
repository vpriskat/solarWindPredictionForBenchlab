name: Live Solar Wind Cycle

on:
  schedule:
    - cron: "20 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      t0:
        description: "Optional cycle timestamp (e.g. 20261126T120000Z); empty = latest 6h cycle"
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: live-cycle
  cancel-in-progress: false

jobs:
  run-live-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run live forecast cycle
        env:
          T0: ${{ inputs.t0 }}
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
          docker pull "${IMAGE}"
          docker run --rm -e SWP_STORAGE_URL="" "${IMAGE}" ${T0:+"$T0"}